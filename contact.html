<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Urbanlive</title>
  <meta name="description" content="Contact Urbanlive.fr - Get in touch with us." />
  <link rel="canonical" href="https://urbanlive.fr/contact" />
  <link rel="stylesheet" href="/assets/css/styles.min.css" />
  <style>
    body { background: #0d0d18; color: #ccc; font-family: 'Nunito', sans-serif; padding: 40px 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #fff; font-size: 2rem; margin-bottom: 10px; }
    p { line-height: 1.8; color: #aaa; }
    a { color: #7c6fde; }
    .back { display: inline-block; margin-bottom: 30px; color: #7c6fde; text-decoration: none; }
    .back:hover { color: #fff; }
    hr { border-color: #222; margin: 30px 0; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; color: #ddd; font-size: 0.9rem; }
    input, textarea, select {
      width: 100%; padding: 12px 14px; background: #1a1a2e; border: 1px solid #333;
      border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: #7c6fde; }
    textarea { resize: vertical; min-height: 120px; }
    button[type="submit"] {
      background: #7c6fde; color: #fff; border: none; padding: 12px 28px;
      border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s;
    }
    button[type="submit"]:hover { background: #6558c9; }
  </style>
</head>
<body>
<div class="container">
  <a class="back" href="/">← Back to Home</a>
  <h1>Contact Us</h1>
  <p>Have a question, DMCA notice, or feedback? Fill out the form below and we'll get back to you as soon as possible.</p>
  <hr />

  <form method="post" action="/ajax/contact">
    <div class="form-group">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required />
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required />
    </div>
    <div class="form-group">
      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option value="general">General Inquiry</option>
        <option value="dmca">DMCA / Copyright Notice</option>
        <option value="bug">Bug Report</option>
        <option value="request">Anime Request</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
    </div>
    <div class="form-group">
      <button type="submit">Send Message</button>
    </div>
  </form>

  <hr />
  <p style="text-align:center; font-size:0.85rem;">Copyright &copy; <a href="/">urbanlive.fr</a>. All Rights Reserved.</p>
</div>
</body>
</html>
